<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | [Your Name]</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-card {
            max-width: 500px;
            padding: 3rem 2rem;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="error-page">
        <div class="error-card glass-card">
            <div class="error-code">404</div>
            <h2>Oops! Page Lost in Hyperspace</h2>
            <p class="mt-2 mb-4" style="color: var(--text-muted);">The page you are looking for does not exist or has been moved to another coordinate.</p>
            <a href="index.html" class="btn btn-primary">
                <i class="fa-solid fa-house"></i> Return to Portfolio
            </a>
        </div>
    </div>
</body>
</html>
